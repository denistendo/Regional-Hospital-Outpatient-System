kind = "web"
previewPath = "/"
title = "Regional Outpatient Management"
description = "A front-end outpatient management prototype for patients and hospital staff, with booking, triage, doctor assignment, referrals, and patient records using local demo data."
version = "1.0.0"
id = "artifacts/regional-outpatient"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25782

[services.development]
run = "pnpm --filter @workspace/regional-outpatient run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/regional-outpatient", "run", "build" ]
serve = "static"
publicDir = "artifacts/regional-outpatient/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25782"
BASE_PATH = "/"
